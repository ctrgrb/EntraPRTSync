<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="settings_popup.css" />
  </head>
  <body>
  	<div class="panel menu-panel container-panel" id="container-panel">
			<h3 class="title">SSO Proxy</h3>
			<hr>
			<div class="panel-content">
				<form id="settings" name="settings" class="settings">
					<label for="enabled" class="input-label" >Enabled</label>
					<label class="switch" >
						<input id="enabled" class="switch-input" name="enabled" type="checkbox">
						<span class="slider round"></span>
					</label>

					<label class="input-label" for="host" data-i18n-message-id="host">Proxy Host</label>
					<input type="text" id="host" name="host" placeholder="localhost" /><br>
					
					<label class="input-label" for="port" data-i18n-message-id="port">Proxy Port</label>
					<input type="number" id="port" name="port" placeholder="8889" /><br>

					<input type="submit" id="submit" class="primary button" value="Save" />
				</form>
				<div id="status-success" class="status status-success hide">Successfully saved</div>
				<div id="status-error" class="status status-error hide">Failed to save</div>
			</div>
		</div>
		<script src="settings.js"></script>
	</body>
</html>
